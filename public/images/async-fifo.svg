<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FIFO asíncrona entre dos dominios</title>
  <desc id="desc">Una FIFO con relojes de escritura y lectura independientes, flags full y empty, y punteros Gray.</desc>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#25352b" stroke-width="1"/></pattern><linearGradient id="fifo" x1="0" x2="1"><stop stop-color="#30483a"/><stop offset="1" stop-color="#24352b"/></linearGradient></defs>
  <rect width="1200" height="760" fill="#202e26"/><rect width="1200" height="760" fill="url(#grid)"/>
  <text x="70" y="92" fill="#d8f36a" font-family="monospace" font-size="16" letter-spacing="3">ASYNC FIFO / TWO CLOCKS</text>
  <g transform="translate(70 238)"><rect width="210" height="192" rx="5" fill="#24372b" stroke="#f68952"/><text x="105" y="57" fill="#f68952" font-family="monospace" font-size="18" text-anchor="middle">WR_CLK</text><text x="105" y="105" fill="#d8f36a" font-family="monospace" font-size="16" text-anchor="middle">DATA IN</text><text x="105" y="139" fill="#91a694" font-family="monospace" font-size="13" text-anchor="middle">wr_en / full</text><circle cx="26" cy="103" r="7" fill="#f68952"/></g>
  <path d="M280 334h110" stroke="#f68952" stroke-width="5"/>
  <g transform="translate(390 166)"><rect width="430" height="334" rx="6" fill="url(#fifo)" stroke="#d8f36a" stroke-width="2"/><text x="215" y="56" fill="#d8f36a" font-family="monospace" font-size="22" text-anchor="middle" letter-spacing="3">ASYNC FIFO</text><path d="M52 106h326M52 154h326M52 202h326M52 250h326" stroke="#829987" stroke-width="2"/><g fill="#aec6fa"><rect x="72" y="91" width="72" height="30"/><rect x="158" y="91" width="72" height="30"/><rect x="244" y="91" width="72" height="30"/><rect x="96" y="139" width="72" height="30"/><rect x="182" y="139" width="72" height="30"/><rect x="268" y="139" width="72" height="30"/></g><text x="215" y="294" fill="#91a694" font-family="monospace" font-size="13" text-anchor="middle">DUAL-PORT RAM / GRAY POINTERS</text><circle cx="30" cy="108" r="7" fill="#f68952"/><circle cx="400" cy="208" r="7" fill="#d8f36a"/></g>
  <path d="M820 334h110" stroke="#d8f36a" stroke-width="5"/>
  <g transform="translate(930 238)"><rect width="200" height="192" rx="5" fill="#24372b" stroke="#d8f36a"/><text x="100" y="57" fill="#d8f36a" font-family="monospace" font-size="18" text-anchor="middle">RD_CLK</text><text x="100" y="105" fill="#d8f36a" font-family="monospace" font-size="16" text-anchor="middle">DATA OUT</text><text x="100" y="139" fill="#91a694" font-family="monospace" font-size="13" text-anchor="middle">rd_en / empty</text><circle cx="174" cy="103" r="7" fill="#d8f36a"/></g>
  <g transform="translate(100 610)"><circle cx="8" cy="0" r="7" fill="#f68952"/><text x="28" y="5" fill="#91a694" font-family="monospace" font-size="13">WRITE DOMAIN</text><circle cx="220" cy="0" r="7" fill="#d8f36a"/><text x="240" y="5" fill="#91a694" font-family="monospace" font-size="13">READ DOMAIN</text><text x="475" y="5" fill="#91a694" font-family="monospace" font-size="13">FULL / EMPTY = CONTROL, NOT DATA</text></g>
</svg>
