<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Parar para depurar mejor</title>
  <desc id="desc">Una waveform compleja se reduce a un caso mínimo entre un testbench y un módulo RTL.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#25352b" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#202e26"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <text x="70" y="92" fill="#d8f36a" font-family="monospace" font-size="16" letter-spacing="3">DEBUG / TAKE A BREATH</text>
  <g transform="translate(70 165)">
    <rect width="420" height="350" rx="6" fill="#18231d" stroke="#f68952" stroke-width="2"/>
    <text x="36" y="52" fill="#f68952" font-family="monospace" font-size="18">FULL TESTBENCH</text>
    <text x="36" y="85" fill="#91a694" font-family="monospace" font-size="13">too many hypotheses</text>
    <g fill="#91a694" font-family="monospace" font-size="12" text-anchor="middle"><text x="17" y="128">1</text><text x="17" y="164">0</text><text x="17" y="201">1</text><text x="17" y="237">0</text><text x="17" y="274">1</text><text x="17" y="310">0</text></g>
    <path d="M36 124h30v36h34v-36h42v36h31v-36h42v36h33v-36h42v36h42v-36h44v36h28" fill="none" stroke="#f68952" stroke-width="4"/>
    <path d="M36 197h58v36h32v-36h48v36h38v-36h28v36h42v-36h52v36h38v-36h36" fill="none" stroke="#aec6fa" stroke-width="4"/>
    <path d="M36 270h28v36h30v-36h54v36h42v-36h28v36h34v-36h50v36h38v-36h48" fill="none" stroke="#d8f36a" stroke-width="4"/>
  </g>
  <g transform="translate(550 218)">
    <circle cx="50" cy="85" r="52" fill="#24372b" stroke="#d8f36a" stroke-width="3"/>
    <path d="M35 57v56M65 57v56" stroke="#d8f36a" stroke-width="10" stroke-linecap="round"/>
    <text x="50" y="180" fill="#d8f36a" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2">PAUSE</text>
  </g>
  <path d="M660 303h85" stroke="#d8f36a" stroke-width="4" stroke-dasharray="8 9"/>
  <g transform="translate(755 190)">
    <rect width="370" height="300" rx="6" fill="#24372b" stroke="#d8f36a" stroke-width="2"/>
    <text x="35" y="55" fill="#d8f36a" font-family="monospace" font-size="18">MINIMAL CASE</text>
    <text x="35" y="88" fill="#91a694" font-family="monospace" font-size="13">one stimulus / one claim</text>
    <rect x="35" y="130" width="300" height="88" fill="#18231d" stroke="#aec6fa"/>
    <g fill="#91a694" font-family="monospace" font-size="12" text-anchor="middle"><text x="20" y="160">1</text><text x="20" y="198">0</text></g>
    <path d="M52 190h40v-35h45v35h50v-35h45v35h92" fill="none" stroke="#aec6fa" stroke-width="4"/>
    <circle cx="48" cy="190" r="6" fill="#d8f36a"/>
    <text x="185" y="260" fill="#f68952" font-family="monospace" font-size="13" text-anchor="middle">OBSERVABLE</text>
  </g>
  <text x="600" y="650" fill="#91a694" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2">RESET THE QUESTION BEFORE RESETTING THE RTL</text>
</svg>
